name: Build and publish Windows executable
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - desktop.py
      - updater.py
      - accelerator.py
      - git_cache.py
      - src/**
      - Cargo.toml
      - setup.py
      - requirements.txt
      - tests/**
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schoolhub-windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test Rust
        run: |
          cargo test
          cargo build --release
      - name: Test sync and updater
        run: python -m unittest discover -s tests -v
      - name: Install packaging dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Build standalone Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SchoolHub --add-data "VERSION;." --add-binary "target/release/schoolhub-scan.exe;." --hidden-import tkinter.ttk --hidden-import tkinter.filedialog --hidden-import tkinter.simpledialog --hidden-import tkinter.messagebox desktop.py
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $output = Join-Path $PWD "smoke.json"
          $p = Start-Process -FilePath ".\dist\SchoolHub.exe" -ArgumentList @("--smoke", ('"' + $output + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $output)) { throw "Packaged smoke test failed" }
          $result = Get-Content $output -Raw | ConvertFrom-Json
          if (!$result.ok) { throw "Packaged scanner or crypto test failed" }
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $digest = (Get-FileHash dist/SchoolHub.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path dist/SchoolHub.exe.sha256 -Value "$digest  SchoolHub.exe" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolHub-Windows
          path: |
            dist/SchoolHub.exe
            dist/SchoolHub.exe.sha256
      - name: Publish new release (immutable version)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION" }
          $tag = "v$version"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release already exists. Increment VERSION for new builds."; exit 0 }
          gh release create $tag dist/SchoolHub.exe dist/SchoolHub.exe.sha256 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "SchoolHub Rust $version" --notes "Windows executable with automatic verified updates. Original UI is downloaded locally with authorization on first launch. Git for Windows with Git LFS and GCM required for synchronization." --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
